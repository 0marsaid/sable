# Render Blueprint for the free web service plan.
# Free instances have no persistent disk. SQLite lives at ./data/sable.db and
# is wiped on every redeploy, restart, and spin-down. See the README.
services:
  - type: web
    name: sable
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CHANNEL
        value: web
      - key: DATABASE_PATH
        value: ./data/sable.db
      - key: ASSISTANT_NAME
        value: Sable
      - key: OWNER_NAME
        value: Omar
      - key: OWNER_TIMEZONE
        value: America/Los_Angeles
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: APP_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
